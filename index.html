<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドキュメント管理サイト</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📚 ドキュメント管理システム</h1>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="ファイルを検索...">
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="folder-tree">
                    <h3>📁 フォルダ一覧</h3>
                    <div id="fileTree" class="tree">
                        <div class="loading">読み込み中...</div>
                    </div>
                </div>
            </aside>

            <main class="content-area">
                <div class="welcome-message">
                    <h2>ようこそ！</h2>
                    <p>左側のフォルダからドキュメントを選択して表示できます。</p>
                    <div class="supported-formats">
                        <h3>対応ファイル形式:</h3>
                        <ul>
                            <li>📄 テキストファイル (.txt, .md)</li>
                            <li>📋 PDFファイル (.pdf)</li>
                        </ul>
                    </div>
                </div>

                <div id="documentViewer" class="document-viewer" style="display: none;">
                    <div class="document-header">
                        <button id="backButton" class="back-button">← 戻る</button>
                        <div class="breadcrumb" id="breadcrumb"></div>
                    </div>
                    <div class="document-content" id="documentContent"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="libs/pdf.min.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/file-loader.js"></script>
    <script src="js/document-viewer.js"></script>
</body>
</html>
